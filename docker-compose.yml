services:
  # ── Phase 2: 1000명 확장 아키텍처 ──
  # FastAPI + WebSocket 서버 (복수 인스턴스)
  clinic-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7862:7862"
    environment:
      - PYTHONPATH=/app
      - OLLAMA_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=https://yourdomain.com,http://localhost:7862
      - CLOVA_API_URL=${CLOVA_API_URL}
      - CLOVA_API_KEY=${CLOVA_API_KEY}
    depends_on:
      - redis
      - ollama
    restart: unless-stopped
    deploy:
      replicas: 2  # 2개 인스턴스로 분산
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # ollama inference 서버 (GPU 지원 시)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Redis: 캐시 공유 + 세션 관리 +_rate limiting
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  # Nginx: 로드밸런서 + TLS 종료 + 정적 파일 서빙
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - clinic-api
    restart: unless-stopped

volumes:
  ollama_data:
  redis_data:

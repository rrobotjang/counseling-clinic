services:
  - type: web
    name: counseling-clinic-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python api_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
    plan: free

  - type: web
    name: counseling-clinic-gradio
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app_clinic.py --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PORT
        value: 10000
    plan: free
